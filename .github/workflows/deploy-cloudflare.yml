name: Deploy to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static assets
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$SESSION_SECRET" ] || [ -z "$DATABASE_URL" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN, SESSION_SECRET, and DATABASE_URL secrets, and the CLOUDFLARE_ACCOUNT_ID repository variable."
            exit 1
          fi
          npx wrangler deploy
          printf %s "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf %s "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
